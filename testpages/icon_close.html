<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Icon-only Close Button</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; color: #1a1a1a; }
  .dialog { max-width: 360px; margin: 40px auto; background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 20px; position: relative; }
  .dialog h2 { margin: 0 0 12px 0; font-size: 16px; }
  /* Icon-only close ("x") control -- same stressor class as
     icon_settings.html/icon_menu.html, different icon meaning, and a
     genuinely common real-world placement (top-right of a dialog). */
  #close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 18px; height: 18px; min-width: 18px; padding: 0;
    font-size: 12px; line-height: 18px; text-align: center;
    background: #eef0f4; color: #444; border: 1px solid #ccc;
    border-radius: 3px; cursor: pointer;
  }
  .unrelated-text { font-size: 13px; color: #666; }
</style>
</head>
<body>
  <div class="dialog">
    <button id="close-btn" type="button" aria-label="Close" title="Close">&#10005;</button>
    <h2>VisiPilot Demo — Icon Close</h2>
    <p class="unrelated-text">This dialog's only interactable control is a small icon-only close button in its top-right corner, with no visible text label at all.</p>
  </div>
</body>
</html>
