<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Reordered Results (DOM order != visual order)</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  header .logo { font-weight: bold; font-size: 20px; color: #2b5cff; }
  /* The real stressor this page exists for: DOM source order is
     Cherries, Bananas, Apples, but `column-reverse` renders them
     Apples, Bananas, Cherries -- top to bottom, exactly reversed from
     the markup. A pixels-first "click the first result" must resolve
     to the visually topmost item (Apples), never the first element in
     HTML source order (Cherries), since runtime perception never reads
     DOM/source order at all (Instructions.md #2) -- there would be no
     way for it to even know what "DOM order" was to begin with. This
     is the real, mechanistic reason ordinal resolution has to be
     computed from bbox position, not assumed correct because it
     happens to agree with markup order on every other test page. */
  .list {
    display: flex;
    flex-direction: column-reverse;
    max-width: 420px;
  }
  .result {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .result .title { font-size: 14px; }
  .result button {
    padding: 8px 16px;
    font-size: 13px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #results {
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    min-height: 40px;
    max-width: 420px;
  }
  #results:empty::before { content: "No selection yet."; color: #999; }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo — Reordered Results</span>
  </header>

  <div class="list">
    <!-- DOM source order: Cherries, Bananas, Apples.
         Visual (column-reverse) order, top to bottom: Apples, Bananas, Cherries. -->
    <div class="result" id="result-cherries">
      <span class="title">Cherries — 1 review</span>
      <button type="button" onclick="select('Cherries')">Result</button>
    </div>
    <div class="result" id="result-bananas">
      <span class="title">Bananas — 7 reviews</span>
      <button type="button" onclick="select('Bananas')">Result</button>
    </div>
    <div class="result" id="result-apples">
      <span class="title">Apples — 3 reviews</span>
      <button type="button" onclick="select('Apples')">Result</button>
    </div>
  </div>

  <div id="results" role="status"></div>

  <script>
    function select(name) {
      document.getElementById('results').textContent = 'Opened result: ' + name;
    }
  </script>
</body>
</html>
