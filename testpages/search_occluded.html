<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Occluded Button</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  header .logo {
    font-weight: bold;
    font-size: 20px;
    color: #2b5cff;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
    position: relative;
    width: fit-content;
  }
  #search-box {
    width: 320px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #search-btn {
    padding: 10px 20px;
    font-size: 14px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
  }
  /* A real, common real-world hazard: a small overlay (a "New" badge, a
     tooltip, a notification dot) positioned on top of part of a real
     control's clickable area, WITHOUT pointer-events:none -- so a click
     landing in the overlap actually hits the badge, not the button
     underneath. Stresses whether the pipeline's chosen click point (and
     the detector's own bbox) reflects what's really clickable, not just
     the underlying DOM element's nominal geometry. See
     implementation-plan.md B.10. */
  #new-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #ff4d4f;
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 8px;
    z-index: 5;
  }
  #results {
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    min-height: 40px;
  }
  #results:empty::before {
    content: "No results yet.";
    color: #999;
  }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo — Occluded Button</span>
  </header>

  <div class="search-row">
    <input id="search-box" type="text" placeholder="Search..." aria-label="Search">
    <button id="search-btn" type="button">Search</button>
    <span id="new-badge">NEW</span>
  </div>

  <div id="results" role="status"></div>

  <script>
    document.getElementById('search-btn').addEventListener('click', function () {
      var q = document.getElementById('search-box').value;
      var results = document.getElementById('results');
      results.textContent = q ? 'Results for: ' + q : '';
    });
    // A real sibling overlay (not a descendant of the button), so a
    // click landing on it does NOT reach the button underneath unless
    // the browser's own hit-testing picks the button instead -- exactly
    // the real hazard this page stresses.
    document.getElementById('new-badge').addEventListener('click', function (e) {
      e.stopPropagation();
      var results = document.getElementById('results');
      results.textContent = 'Badge clicked, not search.';
    });
  </script>
</body>
</html>
