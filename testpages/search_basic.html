<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Basic Search</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  header .logo {
    font-weight: bold;
    font-size: 20px;
    color: #2b5cff;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
  }
  #search-box {
    width: 320px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #search-btn {
    padding: 10px 20px;
    font-size: 14px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .distractors {
    display: flex;
    gap: 40px;
    margin-bottom: 32px;
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
  }
  .newsletter-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #newsletter-input {
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 220px;
  }
  #subscribe-btn {
    padding: 8px 16px;
    font-size: 13px;
    background: #e0e0e0;
    color: #333;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .unrelated-text {
    max-width: 260px;
    font-size: 13px;
    color: #666;
  }
  #results {
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    min-height: 40px;
  }
  #results:empty::before {
    content: "No results yet.";
    color: #999;
  }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo</span>
  </header>

  <div class="search-row">
    <input id="search-box" type="text" placeholder="Search..." aria-label="Search">
    <button id="search-btn" type="button">Search</button>
  </div>

  <div class="distractors">
    <div class="newsletter-row">
      <input id="newsletter-input" type="email" placeholder="Enter email">
      <button id="subscribe-btn" type="button">Subscribe</button>
    </div>
    <p class="unrelated-text" id="unrelated-text">
      This page also contains distractor elements that a pixels-first
      perception pipeline must correctly ignore when asked to find the
      search box.
    </p>
  </div>

  <div id="results" role="status"></div>

  <script>
    document.getElementById('search-btn').addEventListener('click', function () {
      var q = document.getElementById('search-box').value;
      var results = document.getElementById('results');
      results.textContent = q ? 'Results for: ' + q : '';
    });
  </script>
</body>
</html>
