<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Dynamic Content</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  header .logo {
    font-weight: bold;
    font-size: 20px;
    color: #2b5cff;
  }
  /* Appears ~700ms after load, shifting everything below it down -- a
     real-world pattern (a late-loading ad/consent banner) that
     genuinely invalidates coordinates computed from a screenshot taken
     before it appears. Stresses the stale-screenshot detection added
     for Instructions.md #7's rule -- see implementation-plan.md B.10/C.1.

     This value has been tuned twice, both times by measuring rather
     than assuming (implementation-plan.md C.4 has the second one's
     full writeup): B.10 originally used 600ms, comfortably under the
     cold-cache perception latency (~1.7s) known at the time; that
     proved too long once a warm cache brought real perception down to
     ~450-500ms, so it was lowered to 200ms. That in turn proved too
     SHORT: `launch_page()`'s navigation plus the time to capture the
     very first ("before") screenshot was independently measured at
     285-461ms on its own -- comfortably above 200ms -- so the banner
     was already visible by the time ANY screenshot was taken, and the
     "before vs. after" comparison this page exists to exercise never
     actually saw a change. 700ms sits with real margin on both sides
     of what was actually measured: above the ~461ms worst-case
     navigation-to-first-screenshot time (so the "before" screenshot
     reliably predates the banner), and below the ~1131ms fastest
     observed full perception pass (so the banner has reliably already
     appeared by the time a CLICK/TYPE step's staleness check runs). */
  #late-banner {
    display: none;
    padding: 10px 16px;
    margin-bottom: 16px;
    background: #fff3cd;
    border: 1px solid #ffe69c;
    border-radius: 4px;
    font-size: 13px;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
  }
  #search-box {
    width: 320px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #search-btn {
    padding: 10px 20px;
    font-size: 14px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #results {
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    min-height: 40px;
  }
  #results:empty::before {
    content: "No results yet.";
    color: #999;
  }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo — Dynamic Content</span>
  </header>

  <div id="late-banner">This site uses cookies. By continuing you agree to our policy.</div>

  <div class="search-row">
    <input id="search-box" type="text" placeholder="Search..." aria-label="Search">
    <button id="search-btn" type="button">Search</button>
  </div>

  <div id="results" role="status"></div>

  <script>
    document.getElementById('search-btn').addEventListener('click', function () {
      var q = document.getElementById('search-box').value;
      var results = document.getElementById('results');
      results.textContent = q ? 'Results for: ' + q : '';
    });
    window.setTimeout(function () {
      document.getElementById('late-banner').style.display = 'block';
    }, 700);
  </script>
</body>
</html>
