<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Small Icon Button</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  header .logo { font-weight: bold; font-size: 20px; color: #2b5cff; }
  .toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    padding: 6px;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    width: fit-content;
  }
  .icon-btn {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef0f4;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
    color: #444;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
    align-items: center;
  }
  #search-box {
    width: 280px;
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  /* The search "button" here is a 16x16px icon-only control with no
     visible text label at all — the real stressor: OCR has nothing to
     read for it, and the detector must find a sub-20px region. */
  #search-btn {
    width: 16px;
    height: 16px;
    min-width: 16px;
    padding: 0;
    font-size: 10px;
    line-height: 16px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  .distractors {
    display: flex;
    gap: 40px;
    margin-bottom: 32px;
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
  }
  .newsletter-row { display: flex; gap: 8px; align-items: center; }
  #newsletter-input {
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 220px;
  }
  #subscribe-btn {
    padding: 8px 16px;
    font-size: 13px;
    background: #e0e0e0;
    color: #333;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .unrelated-text { max-width: 260px; font-size: 13px; color: #666; }
  #results {
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    min-height: 40px;
  }
  #results:empty::before { content: "No results yet."; color: #999; }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo — Small Icon Button</span>
  </header>

  <div class="toolbar">
    <div class="icon-btn" title="Bold">B</div>
    <div class="icon-btn" title="Italic">I</div>
    <div class="icon-btn" title="Underline">U</div>
  </div>

  <div class="search-row">
    <input id="search-box" type="text" placeholder="Search..." aria-label="Search">
    <button id="search-btn" type="button" aria-label="Search" title="Search">&#128269;</button>
  </div>

  <div class="distractors">
    <div class="newsletter-row">
      <input id="newsletter-input" type="email" placeholder="Enter email">
      <button id="subscribe-btn" type="button">Subscribe</button>
    </div>
    <p class="unrelated-text" id="unrelated-text">
      This variant's search button has no visible text label at all —
      just a small icon — stressing small-element detection and
      text-free matching.
    </p>
  </div>

  <div id="results" role="status"></div>

  <script>
    document.getElementById('search-btn').addEventListener('click', function () {
      var q = document.getElementById('search-box').value;
      var results = document.getElementById('results');
      results.textContent = q ? 'Results for: ' + q : '';
    });
  </script>
</body>
</html>
