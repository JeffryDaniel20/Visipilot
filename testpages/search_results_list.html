<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Results List (Ordinal Reference)</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1a1a1a;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  header .logo { font-weight: bold; font-size: 20px; color: #2b5cff; }
  /* Three results whose only interactable control is IDENTICALLY
     labeled "Result" -- the real stressor an ordinal reference exists
     for (Phase C.2): text alone can never distinguish "the second
     result" from the other two, since all three buttons carry the
     exact same phrase. DOM order matches visual (top-to-bottom) order
     on this page; see search_results_reordered.html for the case where
     it deliberately doesn't. */
  .result {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
    max-width: 420px;
  }
  .result .title { font-size: 14px; }
  .result button {
    padding: 8px 16px;
    font-size: 13px;
    background: #2b5cff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #results {
    padding: 16px;
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    min-height: 40px;
    max-width: 420px;
  }
  #results:empty::before { content: "No selection yet."; color: #999; }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo — Results List</span>
  </header>

  <div class="result" id="result-1">
    <span class="title">Apples — 3 reviews</span>
    <button type="button" onclick="select(1)">Result</button>
  </div>
  <div class="result" id="result-2">
    <span class="title">Bananas — 7 reviews</span>
    <button type="button" onclick="select(2)">Result</button>
  </div>
  <div class="result" id="result-3">
    <span class="title">Cherries — 1 review</span>
    <button type="button" onclick="select(3)">Result</button>
  </div>

  <div id="results" role="status"></div>

  <script>
    function select(n) {
      document.getElementById('results').textContent = 'Opened result ' + n;
    }
  </script>
</body>
</html>
