<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisiPilot Test Page — Icon-only Settings Button</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; color: #1a1a1a; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  header .logo { font-weight: bold; font-size: 20px; color: #2b5cff; }
  /* Icon-only control, no visible text label -- the same class of
     stressor as search_small_icons.html's #search-btn, but for a
     different icon meaning (settings/gear), used to test whether a
     captioning signal's output content actually matches "settings"
     rather than just detecting "some icon". */
  #settings-btn {
    width: 18px; height: 18px; min-width: 18px; padding: 0;
    font-size: 12px; line-height: 18px; text-align: center;
    background: #eef0f4; color: #444; border: 1px solid #ccc;
    border-radius: 3px; cursor: pointer;
  }
  .unrelated-text { max-width: 260px; font-size: 13px; color: #666; margin-top: 24px; }
</style>
</head>
<body>
  <header>
    <span class="logo">VisiPilot Demo — Icon Settings</span>
    <button id="settings-btn" type="button" aria-label="Settings" title="Settings">&#9881;</button>
  </header>
  <p class="unrelated-text">This page's only interactable control is a small icon-only settings button in the header, with no visible text label at all.</p>
</body>
</html>
